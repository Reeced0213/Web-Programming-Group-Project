<div class="contact-form-container">
  <h1>Contact Us</h1>
  <p>Any questions or remarks? Leave us a message!</p>
<hr>
  
  <!-- Replace the action URL with your actual form backend endpoint -->
  <form action="https://typicode.com" method="POST">
    
    <!-- Name Field -->
    <div class="form-group">
      <label for="firstname">First Name</label><br>
      <input type="text" id="firstname" name="firstname" placeholder="John" required>
	  <br><br>
    </div>

	    <div class="form-group">
      <label for="lastname">Last Name</label><br>
      <input type="text" id="lastname" name="lastname" placeholder="Smith" required>
	  <br><br>
    </div>
    
    <!-- Email Field -->
    <div class="form-group">
      <label for="email">Email Address</label><br>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
	<br><br>
    </div>
    
    <!-- Message Field -->
    <div class="form-group">
      <label for="message">Your Message</label>
	  <br>
      <textarea rows="5" name="message" id="message" placeholder="How can we help you?" required></textarea>
</textarea><br><br>
    </div>
    
    <!-- Submit Button -->
    <button type="submit">Send Message</button>
	 </fieldset>
  </form>
</div>
