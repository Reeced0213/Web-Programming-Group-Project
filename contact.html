<main>
<div id="contact">
<h1>Contact Us</h1>
</main>

<div class="form-container">
  <p style="text-align: center;">Any questions or remarks? Leave us a message and our team will get back to you as soon as possible!</p>
<hr>
  <form action="https://typicode.com" method="POST">
    
	<div class="form-group">
		<label>How did you hear about us?</label><br>
		<input type="radio" id="hear-online" name="how-heard" value="online">
		
		<label for="hear-online">Online Search</label><br>

		<input type="radio" id="hear-social" name="how-heard" value="social-media">
		<label for="hear-social">Social Media</label><br>

		<input type="radio" id="hear-friend" name="how-heard" value="friend">
		<label for="hear-friend">From a Friend</label><br>

		<input type="radio" id="hear-other" name="how-heard" value="other">
		<label for="hear-other">Other</label><br><br>
</div>
    <div class="form-group">
      <label for="firstname">First Name</label><br>
      <input type="text" id="firstname" name="firstname" placeholder="ex:'John'" required>
	  <br><br>
    </div>
	<div class="form-group">
      <label for="lastname">Last Name</label><br>
      <input type="text" id="lastname" name="lastname" placeholder="ex:'Smith'" required>
	  <br><br>
    </div>
    <div class="form-group">
      <label for="email">Email Address</label><br>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
	<br><br>
    </div> 
    <div class="form-group">
      <label for="message">Your Message</label>
	  <br>
      <textarea rows="5" name="message" id="message" placeholder="How can we help you?" required></textarea>
</textarea><br><br>
    </div>
    
    <button type="submit">Send Message</button>
   </body>
  </form>
</div>
