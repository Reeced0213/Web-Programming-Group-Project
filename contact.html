<div class="contact-form-container">
  <h1>Contact Us</h1>
  
  <!-- Replace the action URL with your actual form backend endpoint -->
  <form action="https://typicode.com" method="POST">
    
    <!-- Name Field -->
    <div class="form-group">
      <label for="firstname">FirstName</label>
      <input type="text" id="firstname" name="firstname" placeholder="Your first name" required>
    </div>

	    <div class="form-group">
      <label for="lastname">LastName</label>
      <input type="text" id="lastname" name="lastname" placeholder="Your last name" required>
    </div>
    
    <!-- Email Field -->
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>
    
    <!-- Message Field -->
    <div class="form-group">
      <label for="message">Your Message</label>
      <textarea id="message" name="message" rows="5" cols="40" placeholder="How can we help you?" required></textarea>
    </div>
    
    <!-- Submit Button -->
    <button type="submit">Send Message</button>
    
  </form>
</div>
